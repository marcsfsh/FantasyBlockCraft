<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fantasy BlockCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#a9d3ff; --ink:#f3efe2; --dim:#b8b09a; --panel:rgba(28,24,18,.84); --edge:#6b5a3e; --sel:#fff6c8; --moss:#7fae4a; --dirt:#86603f; --lift:0px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#a9d3ff;}}
:root[data-theme="dark"]{--bg:#a9d3ff;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"VT323",ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#info{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));font-size:20px;line-height:1.05;text-shadow:2px 2px 0 rgba(0,0,0,.55);white-space:pre}
#cross{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;mix-blend-mode:difference}
#cross::before,#cross::after{content:"";position:absolute;background:#fff}
#cross::before{left:9px;top:0;width:2px;height:20px}
#cross::after{top:9px;left:0;height:2px;width:20px}
#bar{--s:min(46px,calc((100vw - 48px)/9));position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:4px;background:var(--panel);border:3px solid var(--edge);pointer-events:auto}
.slot{width:var(--s);height:var(--s);border:3px solid transparent;display:grid;place-items:center;position:relative;cursor:pointer}
.slot.on{border-color:var(--sel)}
.slot canvas{width:70%;height:70%;image-rendering:pixelated}
.slot span{position:absolute;left:2px;top:-3px;font-size:14px;color:var(--dim)}
.dur{position:absolute;left:10%;bottom:3px;height:3px;border-radius:1px}
.slot .cnt{position:absolute;right:2px;bottom:-4px;font-weight:400;font-size:17px;text-shadow:1px 1px 0 #000}
#lore{display:none;max-width:min(560px,86vw);font-size:22px;line-height:1.25;background:#e8dfc6;color:#3a2a18;padding:14px 18px;border:3px solid #8a6a40;margin-bottom:8px}
#trade{display:none;flex-direction:column;gap:4px;width:min(620px,88vw);max-height:66vh;overflow:auto}
#sinv{display:none;gap:16px;flex-wrap:wrap;width:min(900px,88vw);align-items:flex-start}
.scol{flex:0 1 auto}
.sgrid{display:grid;grid-template-columns:repeat(9,minmax(30px,46px));gap:4px}
.sslot{aspect-ratio:1;background:#2a241a;border:3px solid #463a28;position:relative;display:grid;place-items:center;padding:0;cursor:pointer;font:inherit;color:var(--ink)}
.sslot.hb{background:#3a3122}.sslot:nth-child(9){margin-bottom:8px}
.sslot canvas{width:62%;height:62%;image-rendering:pixelated}
.sslot .n{position:absolute;right:3px;bottom:-2px;font-size:17px;text-shadow:1px 1px 0 #000}
.sslot.held{border-color:var(--sel)}
.recipes{flex:1 1 280px;max-height:62vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.rec{display:flex;align-items:center;gap:8px;background:#2a241a;border:2px solid #463a28;padding:4px 6px}
.rec.no{opacity:.45}
.rec canvas{width:28px;height:28px;image-rendering:pixelated;flex:none}
.rec .t{flex:1;font-size:19px;line-height:1}
.rec .t small{display:block;color:var(--dim);font-size:16px;margin-top:2px}
.rec button{font:inherit;font-size:18px;background:#5f8a35;color:var(--ink);border:2px solid #2b3a1a;padding:0 10px;cursor:pointer}
.rec button:disabled{background:#3a3326;border-color:#463a28;cursor:default}
#hurt{position:absolute;inset:0;background:radial-gradient(circle,rgba(200,0,0,0) 40%,rgba(200,0,0,.6));opacity:0;transition:opacity .25s}
#stats{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(480px,94vw);display:none;justify-content:space-between;align-items:flex-end}
#stats img{width:18px;height:18px;image-rendering:pixelated;margin-right:1px}#stats img.half{clip-path:inset(0 50% 0 0)}
#airfood{display:flex;flex-direction:column;align-items:flex-end}#food{direction:rtl}#air{direction:rtl;min-height:0}
body.surv #name{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
#death{position:fixed;inset:0;display:none;place-items:center;background:rgba(90,0,0,.55);z-index:7}
#death h1{font-size:64px;margin:0;font-weight:400;color:#ffdede;text-shadow:4px 4px 0 #400}
#death p{font-size:24px;max-width:80vw}
#name{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));font-size:26px;text-shadow:2px 2px 0 rgba(0,0,0,.6);opacity:0;transition:opacity .4s;white-space:nowrap}
#toast{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:22px;background:var(--panel);border:3px solid var(--edge);padding:2px 12px;display:none}
#tint{position:absolute;inset:0;display:none}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,26,34,.45);z-index:5;overflow:auto}
#card{background:var(--panel);border:4px solid var(--edge);padding:20px 24px;max-width:min(580px,94vw);max-height:94vh;overflow:auto;box-shadow:8px 8px 0 rgba(0,0,0,.35)}
#card h1{margin:0;font-size:64px;line-height:.9;font-weight:400;color:var(--moss);text-shadow:4px 4px 0 #2b3a1a;letter-spacing:1px}
#card p{margin:8px 0;font-size:21px;line-height:1.15}
#card .keys{color:var(--dim);font-size:19px;columns:2;column-gap:22px;margin-top:8px}
#card .keys div{break-inside:avoid}
#card b{font-weight:400;color:var(--sel)}
#load{height:14px;border:3px solid var(--edge);margin:12px 0 6px;background:#1c1810}
#loadfill{height:100%;width:0;background:var(--moss)}
#status{color:var(--dim);font-size:19px}
.set{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:12px;font-size:20px}
.set label{display:flex;align-items:center;gap:8px}
.set input[type=range]{width:120px;accent-color:#7fae4a}
.seg{display:flex;align-items:center;gap:4px}
.seg button,#sndbtn{font:inherit;font-size:19px;background:#2a241a;color:var(--ink);border:2px solid #463a28;padding:1px 8px;cursor:pointer}
.seg button.on{border-color:var(--sel);color:var(--sel)}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button.big{font:inherit;font-size:26px;padding:6px 18px;background:var(--dirt);color:var(--ink);border:3px solid #3b2a1a;box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.18);cursor:pointer}
button:focus-visible,.slot:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
#seedin,#worldname{font:inherit;font-size:21px;background:#2a241a;color:var(--ink);border:2px solid #463a28;padding:4px 8px;width:180px}
.worlds{margin-top:12px;display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.wrow{display:flex;align-items:center;gap:8px;padding:4px 6px;border:2px solid #463a28}
.wrow.on{border-color:var(--ink)}
.wrow .t{flex:1;display:flex;flex-direction:column}
.wrow small{opacity:.7}
button.big.go{background:#5f8a35;border-color:#2b3a1a}
button.big:disabled{opacity:.5;cursor:default}
#inv{position:fixed;inset:0;display:none;place-items:center;background:rgba(20,26,34,.5);z-index:6}
#invcard{background:var(--panel);border:4px solid var(--edge);padding:16px;max-width:94vw;max-height:92vh;overflow:auto}
#invcard h2{margin:0 0 10px;font-weight:400;font-size:28px}
#invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;width:min(560px,86vw)}
.inv-h{grid-column:1/-1;font-size:20px;color:var(--dim);margin-top:4px}
.inv-item{background:#2a241a;border:3px solid #463a28;aspect-ratio:1;display:grid;place-items:center;cursor:pointer;padding:0}
.inv-item:hover{border-color:var(--sel)}
.inv-item canvas{width:60%;height:60%;image-rendering:pixelated}
#invname{margin-top:8px;font-size:20px;color:var(--dim);min-height:1.2em}
/* touch layout */
#touch{display:none}
#padcur{position:fixed;left:-4px;top:-3px;z-index:9999;pointer-events:none;display:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
body.gp #touch{display:none!important}
body.touch #touch{display:block}
body.touch #info{font-size:16px}
body.touch #bar{--s:clamp(30px,calc((100vw - 420px)/9),44px)}
.tb{position:absolute;pointer-events:auto;font:inherit;font-size:18px;color:var(--ink);background:rgba(28,24,18,.42);border:3px solid rgba(243,239,226,.35);border-radius:50%;display:grid;place-items:center;touch-action:none;padding:0}
.tb svg{width:52%;height:52%;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:square}
.tb.on{background:rgba(127,174,74,.55);border-color:rgba(255,246,200,.8)}
.tb.sq{border-radius:6px;width:50px;height:44px}
#tJump{width:80px;height:80px;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px) + var(--lift))}
#tBreak{width:64px;height:64px;right:calc(118px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px) + var(--lift))}
#tPlace{width:64px;height:64px;right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(118px + env(safe-area-inset-bottom,0px) + var(--lift))}
#tDown{width:56px;height:56px;right:calc(114px + env(safe-area-inset-right,0px));bottom:calc(114px + env(safe-area-inset-bottom,0px) + var(--lift));display:none}
#joyb{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border:3px solid rgba(255,255,255,.3);border-radius:50%;background:rgba(0,0,0,.08)}
#joyk{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;background:rgba(255,255,255,.32);border-radius:50%}
#joyk.run{background:rgba(255,246,200,.7)}
#mm{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:150px;height:150px;border:3px solid var(--edge);background:#1c1810;image-rendering:pixelated;pointer-events:auto;cursor:pointer}
body.touch #mm{width:104px;height:104px;right:auto;left:calc(10px + env(safe-area-inset-left,0px));top:calc(78px + env(safe-area-inset-top,0px))}
#ttop{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:min(400px,60vw);pointer-events:none}
#ttop .tb{position:static;font-size:18px}
#tSwap.on{background:rgba(214,170,60,.6)}
@media (orientation:portrait){
  body.touch{--lift:70px}
  body.touch #bar{--s:min(44px,calc((100vw - 44px)/9))}
}
@media (prefers-reduced-motion:reduce){#name{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="tint"></div><div id="hurt"></div>
  <div id="info"></div>
  <div id="toast"></div>
  <canvas id="mm" width="150" height="150" aria-label="Map, tap to zoom"></canvas>
  <div id="cross"></div>
  <div id="name"></div>
  <div id="stats"><div id="hearts"></div><div id="airfood"><div id="air"></div><div id="food"></div></div></div>
  <div id="bar"></div>
  <div id="touch">
    <div id="joyb"></div><div id="joyk"></div>
    <button class="tb" id="tJump" aria-label="Jump or fly up"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></button>
    <button class="tb" id="tDown" aria-label="Fly down"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button>
    <button class="tb" id="tBreak" aria-label="Break block"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 4l3 6-3 4 4 6M14 10l4-1"/></svg></button>
    <button class="tb" id="tPlace" aria-label="Place block"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M12 8v8M8 12h8"/></svg></button>
    <div id="ttop">
    <button class="tb sq" id="tPause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
    <button class="tb sq" id="tUndo">Undo</button>
    <button class="tb sq" id="tSwap" aria-label="Replace mode">Swap</button>
    <button class="tb sq" id="tBrush" aria-label="Brush size">1x</button>
    <button class="tb sq" id="tFly">Fly</button>
    <button class="tb sq" id="tInv" aria-label="Block menu"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
    </div>
  </div>
</div>
<div id="overlay"><div id="card">
  <h1>Fantasy BlockCraft</h1>
  <p id="seedline">Building a world.</p>
  <div id="load"><div id="loadfill"></div></div>
  <div id="status">Starting</div>
  <div class="keys" id="keys"></div>
  <div class="set">
    <label>Look speed <input type="range" id="sens" min="0.3" max="2.5" step="0.1"></label>
    <label>Field of view <input type="range" id="fovr" min="60" max="100" step="1"></label>
    <div class="seg" id="viewseg">View <button data-v="0">Near</button><button data-v="1">Normal</button><button data-v="2">Far</button></div>
    <div class="seg" id="modeseg">Mode <button data-v="survival">Survival</button><button data-v="creative">Creative</button></div>
    <div class="seg" id="timeseg">Time <button data-v="cycle">Cycle</button><button data-v="day">Day</button><button data-v="night">Night</button></div>
    <div class="seg" id="caveseg">Caves <button data-v="0">Dark</button><button data-v="1">Lantern</button><button data-v="2">Bright</button></div>
    <div class="seg" id="wxseg">Weather <button data-v="1">On</button><button data-v="0">Off</button></div>
    <div class="seg" id="touchseg">Touch <button data-v="auto">Auto</button><button data-v="on">On</button><button data-v="off">Off</button></div>
    <button id="sndbtn">Sound on</button>
  </div>
  <div class="btns"><button class="big go" id="play" disabled>Play</button><button class="big" id="photo">Photo mode</button><input id="worldname" placeholder="New world name" aria-label="Name for the new world" autocomplete="off"><input id="seedin" placeholder="Seed (optional)" aria-label="Seed for the new world" autocomplete="off"><button class="big" id="newworld">New world</button></div>
  <div id="worlds" class="worlds"></div><input type="file" id="importfile" accept=".json,application/json" hidden>
</div></div>
<div id="death"><div style="text-align:center"><h1>You died</h1><p id="deathmsg"></p><button class="big go" id="respawnbtn">Respawn</button></div></div>
<div id="inv"><div id="invcard"><h2 id="invtitle">Pick a block</h2><div id="sinv"></div><div id="lore"></div><div id="invgrid"></div><div id="bplist" class="recipes"></div><div id="invname">Tap a block to put it in the hotbar.</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
// Touch layout: the Touch setting (auto/on/off, read before settings load) or, on auto, a coarse pointer with no precise pointer at all
const TOUCH=(p=>p==='on'||(p!=='off'&&window.matchMedia('(pointer:coarse)').matches&&!window.matchMedia('(any-pointer:fine)').matches))((lsGet('blockcraft-settings-v1')||{}).touch);
if(TOUCH)document.body.classList.add('touch');

// Settings and save data
const W=224,D=224,H=512,SEA=310,CS=16,NCX=W/CS,NCZ=D/CS,VOL=W*H*D;
const SKY=0xa9d3ff,SAVE_KEY='fantasy-blockcraft-save-v4',SET_KEY='blockcraft-settings-v1';
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
// Worlds: an index under SAVE_KEY ({active, list:[{id,name,seed,mode,created,played}]}) and each world's data under SAVE_KEY+':'+id.
// Bumping SAVE_KEY retires every world: saves always yield to updates (D-019).
for(const k of ['fantasy-blockcraft-save-v1','fantasy-blockcraft-save-v2','fantasy-blockcraft-save-v3','blockcraft-nextseed'])lsDel(k); // retired formats: free their storage
const worldKey=id=>SAVE_KEY+':'+id;
function worldIndex(){const x=lsGet(SAVE_KEY);return x&&Array.isArray(x.list)?x:{active:null,list:[]};}
function newWorldEntry(name,seed,mode){return{id:'w'+Date.now().toString(36)+(Math.random()*1679616|0).toString(36),name:name,seed:seed||((Math.random()*2147483000|0)+1),mode:mode==='creative'?'creative':'survival',created:Date.now(),played:Date.now()};}
const WIX=worldIndex();
if(!WIX.list.some(w=>w.id===WIX.active)){if(!WIX.list.length)WIX.list.push(newWorldEntry('World 1',0,(lsGet(SET_KEY)||{}).newMode));WIX.active=WIX.list[0].id;lsSet(SAVE_KEY,WIX);}
const WORLD=WIX.list.find(w=>w.id===WIX.active);
const saved=(d=>d&&d.v===4&&d.seed===WORLD.seed?d:null)(lsGet(worldKey(WORLD.id)));
const SEED=WORLD.seed;
const settings=Object.assign({touch:'auto',cave:1,fov:75,sens:1,view:TOUCH?0:1,sound:true,time:'cycle',weather:true},lsGet(SET_KEY)||{});
const VIEWS=[[34,70],[50,90],[60,98]];

// Seeded random and noise
function mkRng(s){return function(){s=(s*16807)%2147483647;return s/2147483647;};}
const wr=mkRng(SEED),tr=mkRng(424242);
const perm=new Uint8Array(512);
(function(){const r=mkRng((SEED^0x5bd1e995)>>>0||7),p=[];for(let i=0;i<256;i++)p[i]=i;for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));const t=p[i];p[i]=p[j];p[j]=t;}for(let i=0;i<512;i++)perm[i]=p[i&255];})();
const fade=t=>t*t*t*(t*(t*6-15)+10),lerp=(a,b,t)=>a+t*(b-a);
function grad(h,x,y,z){h&=15;const u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v);}
function noise3(x,y,z){
  let X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);x-=X;y-=Y;z-=Z;X&=255;Y&=255;Z&=255;
  const u=fade(x),v=fade(y),w=fade(z),p=perm;
  const A=p[X]+Y,AA=p[A]+Z,AB=p[A+1]+Z,B=p[X+1]+Y,BA=p[B]+Z,BB=p[B+1]+Z;
  return lerp(lerp(lerp(grad(p[AA],x,y,z),grad(p[BA],x-1,y,z),u),lerp(grad(p[AB],x,y-1,z),grad(p[BB],x-1,y-1,z),u),v),
              lerp(lerp(grad(p[AA+1],x,y,z-1),grad(p[BA+1],x-1,y,z-1),u),lerp(grad(p[AB+1],x,y-1,z-1),grad(p[BB+1],x-1,y-1,z-1),u),v),w);
}
function fbm2(x,z,oct,o){let a=1,f=1,s=0,n=0;for(let i=0;i<oct;i++){s+=a*noise3(x*f+o,0.31+i*7.13,z*f+o);n+=a;a*=0.5;f*=2;}return s/n;}
const pick=(arr,r)=>arr[Math.floor(r()*arr.length)];
const sstep=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};

// ---- Names: one style per people from original syllables, and a blocklist so no generated name is one of Tolkien's
// Styles other than dwarf are first drafts for the owner to approve (D-019, Q26, Q28). Each name is two syllables: a + b.
const PEOPLES={
  dwarf:{a:['Ark','Bram','Brod','Dag','Drom','Fenn','Gald','Gorm','Hald','Harn','Jor','Kald','Karn','Krag','Lod','Mag','Nord','Orm','Rag','Rund','Skar','Stav','Torg','Ulm','Vald','Varn','Yorm'],
         b:['ak','ard','brek','dal','dek','fast','gar','hald','kin','lok','mund','nir','rak','rek','rim','stad','tun','und','vek','ulf']},
  human:{a:['Al','Bran','Cen','Ed','Gar','Hal','Mar','Os','Rand','Wil','Ber','Col','Dun','Hew','Lan','Tob'],b:['ric','wen','mund','ford','ley','wick','ton','bert','win','ard','helm','ston']},

function survivalTick(dt,inLiq,moved,sprinting){

  else if(PL.ground){if(fallTop!==null&&fallTop-PL.y>3.5)hurt(Math.floor(fallTop-PL.y-3),'fell');fallTop=PL.y;}
  else fallTop=fallTop===null?PL.y:Math.max(fallTop,PL.y);

  if(liquidAt(PL.x,PL.y+0.2,PL.z)===2||liquidAt(PL.x,PL.y+1.2,PL.z)===2)hurt(4,'lava');
  if(cactusNear())hurt(1,'cactus');

  if(get(Math.floor(PL.x),Math.floor(PL.y+EYE),Math.floor(PL.z))===WATER){air-=dt;if(air<=0){air=0;drownT+=dt;if(drownT>=1){drownT=0;hurt(2,'drowned');}}}
  else{air=Math.min(10,air+dt*5);drownT=0;}

  exh+=moved*(sprinting?0.1:0.01)+dt*0.003;

  if(food>=18&&hp<20){regenT+=dt;if(regenT>=4){regenT=0;hp++;exh+=3;}}else regenT=0;
