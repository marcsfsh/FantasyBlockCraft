# Publishes the latest main to GitHub Pages: the game folder at the site root and the
# single-file build at /fantasy-blockcraft.html.
#
# Safe when Pages is off: the first job asks GitHub whether Pages is enabled with
# "GitHub Actions" as its source. If not, it writes a note to the run summary and every
# later job is skipped, so the run ends green and nothing is published.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages-enabled:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled with GitHub Actions as its source. Deploying." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GitHub Pages is not set up, so nothing was deployed"
              echo ""
              echo "Pages source reported: \`${build_type:-not enabled}\`."
              echo "To publish the game: Settings > Pages > Build and deployment > Source: **GitHub Actions**, then re-run this workflow."
              echo "Until then, download builds from the CI workflow's artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: pages-enabled
    if: needs.pages-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Build both targets
        run: npm run build
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R dist/web/. _site/
          cp dist/single/fantasy-blockcraft.html _site/fantasy-blockcraft.html
          ls -R _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
